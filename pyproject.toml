[project]
name = "crypto-surveillance-stream"
version = "4.2.0"
description = "Real-time Crypto Market Surveillance & Streaming Data Platform"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
norecursedirs = [".*", "pytest-cache-files-*", "venv", ".venv", "data", "dbt", "clickhouse", "frontend"]
addopts = "--rootdir=tests -p no:cacheprovider --confcutdir=tests -v"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "C901", "S"]
ignore = ["RUF001"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.coverage.run]
source = ["common", "ingestors", "spark", "backend", "pipelines"]
omit = ["tests/*"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
cache_dir = "nul"

[[tool.mypy.overrides]]
module = ["aiokafka.*", "prometheus_client.*"]
ignore_missing_imports = true
